name: 试用反馈
description: 记录实际采用的改稿、方案或预算，指出空泛、算错和遗漏的地方
title: "[试用反馈] "
body:
  - type: markdown
    attributes:
      value: |
        感谢试用。反馈及 GitHub 用户名会公开显示，请只填写可公开的脱敏摘要。所有结果都欢迎，包括使用中断或没有帮助。
  - type: dropdown
    id: occasion
    attributes:
      label: 这次用在什么场景？
      options:
        - 第一个真实产品的众筹自评
        - 同一产品补充了新证据
        - 第二个或更多真实产品
        - 虚构案例或学习
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 产品目前处于什么阶段？
      options:
        - 产品定义或样机探索
        - 准备预热或上线
        - 预热或众筹进行中
        - 已结束众筹，复盘或准备下一轮
  - type: dropdown
    id: method
    attributes:
      label: 使用入口
      options:
        - 安装 Skill
        - 复制免安装试用说明
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: 使用的 AI 与模型
      placeholder: 例如 Codex 或 Claude，以及可见的模型名称
  - type: textarea
    id: before
    attributes:
      label: 你们原本准备怎么做？
      placeholder: 例如按原日期上线、先投入预热，或调整产品、价格和交付承诺
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 你们实际采用了哪一段成果，改变了什么？
      placeholder: 例如采用了哪句首屏、哪段分镜、哪个实验或预算决定，也可以写完全没有采用以及原因
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: 哪一点最需要改？
      placeholder: 例如只有泛泛建议、改稿不可用、算错账、问得太多，或与直接问普通 AI 相比没有改善
  - type: textarea
    id: excerpt
    attributes:
      label: 可公开的脱敏片段（选填）
      placeholder: 只提供足以复现问题的脱敏输入和输出
